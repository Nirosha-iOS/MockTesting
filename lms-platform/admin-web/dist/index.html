<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E3A5F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>LMS Admin</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("lms-admin-theme");
          if (!raw) return;
          var p = JSON.parse(raw);
          var d = document.documentElement;
          if (p.mode === "light" || p.mode === "dark") {
            d.dataset.theme = p.mode;
            d.style.colorScheme = p.mode;
          }
          if (p.accent) d.dataset.accent = p.accent;
          if (p.fontScale) d.dataset.fontScale = p.fontScale;
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-BsI3yslh.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BANZmAMc.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
