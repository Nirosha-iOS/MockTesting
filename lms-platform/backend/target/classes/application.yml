spring:
  application:
    name: lms-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: "${DB_PASSWORD:Admin@123}"
